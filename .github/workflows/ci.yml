name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR runs can be cancelled by a newer push; main runs always finish so a deploy is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The site is served from https://nemczzz-rgb.github.io/Weekend_Search/
  PAGES_BASE: /Weekend_Search/

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web build
      - run: node tests/web/tower-background.test.mjs
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  probes:
    name: probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -I -m unittest discover -s tests -v

  deploy:
    name: deploy
    # Publish only main, and only after every check above has passed.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [web, probes]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
