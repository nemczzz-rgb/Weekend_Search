<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Загрузка и ошибка — Weekend Search</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ws.css">
<script src="./ws.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{cls}}" style="width: {{w}}px; height: {{h}}px">
  <div class="tw" style="width: {{w}}px; height: {{vh}}px">
    <sc-for list="{{layers}}" as="l" hint-placeholder-count="1"><svg width="{{w}}" height="{{vh}}" viewBox="0 0 {{w}} {{vh}}" fill="none" aria-hidden="true"><path d="{{l.d}}" stroke="{{l.c}}" stroke-width="{{l.w}}" stroke-linecap="{{l.cap}}"></path></svg></sc-for>
  </div>

  <header class="hdr">
    <a class="logo" href="#" aria-label="Weekend Search — главная"><svg width="34" height="34" viewBox="-23 -23 46 46" fill="none" aria-hidden="true"><path d="{{logo.ink}}" stroke="#191821" stroke-width=".5"></path><path d="{{logo.acc}}" stroke="#3932bd" stroke-width=".55"></path><path d="{{logo.ring}}" stroke="#191821" stroke-width=".7"></path><circle r="2.4" fill="#ffcd00" stroke="#191821" stroke-width=".5"></circle></svg>weekend<span>search</span></a>
    <nav class="nav" aria-label="Основная навигация"><a class="on" href="#" aria-current="page">Идеи для дня</a><a href="#">Маршруты</a><a href="#">Места</a><a href="#">Мой план</a></nav>
    <div class="pal" role="group" aria-label="Цвет сайта"><sc-for list="{{pal}}" as="s" hint-placeholder-count="9"><button aria-label="Цвет сайта" aria-pressed="{{s.on}}"><i style="background: {{s.c}}; height: {{s.h}}"></i></button></sc-for></div>
  </header>

  <main class="z wrap">
    <div class="pgh">
      <span class="rub">Идеи для дня</span>
      <h1 class="h1">Идеи для дня<span class="st"></span></h1>
    </div>

    <sc-if value="{{loading}}" hint-placeholder-val="{{ true }}">
      <div class="g3" style="margin-top: 36px" aria-busy="true">
        <div class="sk" style="height: 300px"></div><div class="sk" style="height: 300px"></div><div class="sk" style="height: 300px"></div>
      </div>
      <p class="small" style="margin-top: 14px">Скелет карточек повторяет их сетку. Вращающихся индикаторов нет.</p>
    </sc-if>
    <sc-if value="{{error}}" hint-placeholder-val="{{ false }}">
      <div class="empty" role="alert" style="margin-top: 36px; max-width: 560px"><span style="font-weight: 600; font-size: 18px; line-height: 1.4">Не получилось загрузить данные. Обновите страницу</span><div><a class="b1" href="#">Обновить</a></div></div>
    </sc-if>
  </main>

  <sc-if value="{{mobile}}" hint-placeholder-val="{{ false }}"><nav class="bbar" aria-label="Основная навигация"><a class="on" href="#" aria-current="page">Идеи для дня</a><a href="#">Маршруты</a><a href="#">Места</a><a href="#">Мой план</a></nav></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mobile":{"editor":null,"default":""},"state":{"editor":null,"default":"loading"},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    var m = !!this.props.mobile, c = WS.common(m, 0.25);
    c.loading = this.props.state !== 'error'; c.error = this.props.state === 'error';
    c.h = m ? 844 : 820;
    return c;
  }
}
</script>
</body>
</html>
