<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekend Search: фон с башней</title>
<style>
  :root {
    /* Оболочка предпросмотра: нейтральный серый стол, на нём два экрана с фоном сайта.
       Тема одна, светлая, потому что сам сайт светлый. */
    color-scheme: light;
    --desk: #dfddd6;
    --paper: #f5f4f1;
    --ink: #17161d;
    --muted: #6d6b76;
    --blue: #3b2fc6;
    --rule: rgba(23, 22, 29, 0.14);
    --sans: "Helvetica Neue", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--desk); }
  body { margin: 0; color: var(--ink); font: 400 15px/1.45 var(--sans); background: var(--desk); }

  .stick { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 14px; padding: 16px clamp(16px, 3vw, 36px) 18px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; }
  h1 { margin: 0; font: 700 17px/1.2 var(--sans); letter-spacing: -0.01em; }
  .read { font: 500 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .read b { color: var(--ink); font-weight: 600; }
  .toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); cursor: pointer; user-select: none; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--blue); margin: 0; }
  .toggle input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .screens { flex: 1; min-height: 0; display: flex; gap: clamp(14px, 2.4vw, 32px); align-items: stretch; justify-content: center; }
  figure { margin: 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  figure.wide { flex: 1 1 0; }
  figure.phone { flex: 0 0 auto; width: calc((100vh - 150px) * 390 / 844); width: calc((100dvh - 150px) * 390 / 844); }
  .fit { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; container-type: size; }
  .screen {
    position: relative; overflow: hidden; background: var(--paper); container-type: size;
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 0 0 1px var(--rule), 0 18px 40px -18px rgba(23, 22, 29, 0.35);
  }
  .wide .screen { aspect-ratio: 1440 / 900; width: min(100cqw, 100cqh * 1.6); border-radius: 6px; }
  .phone .screen { aspect-ratio: 390 / 844; width: min(100cqw, 100cqh * 390 / 844); border-radius: 14px; }
  .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  figcaption { font: 500 11px/1.2 var(--mono); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .foot { font-size: 13px; color: var(--muted); }

  /* условная разметка существующей страницы, по скриншоту главной */
  .ghost { position: absolute; inset: 0; display: none; font-family: var(--sans); color: var(--ink); }
  .show-ghost .ghost { display: block; }
  .ghost > * { position: absolute; }
  .g-line { height: 1px; background: var(--rule); left: 0; right: 0; }
  .g-bar { background: rgba(23, 22, 29, 0.16); border-radius: 99px; }
  .g-blue { background: var(--blue); border-radius: 99px; }
  .g-title { font-weight: 800; letter-spacing: -0.045em; line-height: 0.98; white-space: nowrap; }
  .g-sub { color: var(--muted); white-space: nowrap; }
  .g-pill { background: #fff; border-radius: 99px; box-shadow: 0 0 0 1px rgba(23,22,29,0.05); }
  .g-card { background: rgba(255, 255, 255, 0.9); border-radius: 0.9cqw; box-shadow: 0 0.6cqw 1.6cqw -0.8cqw rgba(23, 22, 29, 0.25); }

  .wide .g-title { left: 3.6cqw; top: 20cqh; font-size: 9.6cqh; }
  .wide .g-sub { left: 3.6cqw; top: 32.4cqh; font-size: 1.75cqh; }
  .phone .g-title { left: 5cqw; top: 13.2cqh; font-size: 6.6cqh; white-space: normal; width: 80cqw; }
  .phone .g-sub { left: 5cqw; top: 28.2cqh; font-size: 1.6cqh; white-space: normal; width: 62cqw; }

  .spacer { height: 2600px; }
  @media (max-width: 700px) {
    .screens { flex-direction: column; align-items: stretch; }
    figure.wide { flex: 0 0 auto; }
    .wide .fit { aspect-ratio: 1440 / 900; flex: none; }
    figure.phone { flex: 1 1 0; width: auto; }
    .toggle { margin-left: 0; }
  }
</style>
</head>

<div class="spacer" aria-hidden="true"></div>

<script>
/* Weekend Search — фон с Шуховской башней.
   Настоящая 3D-решётка: шесть гиперболоидных секций из прямых ног двух направлений и кольца.
   Рисуется на Canvas 2D с перспективой; балки сортируются по глубине, передние перекрывают задние.
   Единственное, что меняется, — угол поворота вокруг вертикальной оси. */
(function (root) {
  'use strict';
  var DEG = Math.PI / 180;
  var PAPER = [245, 244, 241];                 // #f5f4f1
  var INK = [23, 22, 29], BLUE = [59, 47, 198];

  var SECTIONS = [
    { y0: 0,   h: 25, rb: 20.25, rt: 16.25, n: 24, phi: 37.5, rings: 4, w: 0.21 },
    { y0: 25,  h: 25, rb: 16.25, rt: 12.5,  n: 24, phi: 37.5, rings: 4, w: 0.21 },
    { y0: 50,  h: 25, rb: 12.5,  rt: 9.0,   n: 24, phi: 45,   rings: 7, w: 0.17 },
    { y0: 75,  h: 25, rb: 9.0,   rt: 6.0,   n: 24, phi: 45,   rings: 9, w: 0.15 },
    { y0: 100, h: 25, rb: 6.0,   rt: 3.75,  n: 12, phi: 45,   rings: 9, w: 0.14 },
    { y0: 125, h: 20, rb: 3.75,  rt: 2.5,   n: 12, phi: 45,   rings: 9, w: 0.13 }
  ];

  // Слои от оси наружу: 0 — промежуточные кольца, 1 — внутренние ноги (синие),
  // 2 — внешние ноги (чёрные), 3 — опорные кольца. Порядок нужен для перекрытия в узлах.
  var LAYER_COLOR = [INK, BLUE, INK, INK], LAYER_GAIN = [0.62, 1, 1, 1], LAYER_BIAS = [-1.3, -0.3, 0.3, 1.3];

  function build() {
    var S = [], L = [];
    function seg(a, b, w, layer) { S.push(a[0], a[1], a[2], b[0], b[1], b[2], w); L.push(layer); }
    function pt(r, aDeg, y) { return [r * Math.cos(aDeg * DEG), y, r * Math.sin(aDeg * DEG)]; }
    function ring(y, r, w, layer, n) { for (var i = 0; i < n; i++) seg(pt(r, 360 * i / n, y), pt(r, 360 * (i + 1) / n, y), w, layer); }

    ring(0, 20.25, 0.36, 3, 120);
    var phase = 0;
    SECTIONS.forEach(function (s) {
      var step = 360 / s.n, SUB = 16, i, k, d;
      for (i = 0; i < s.n; i++) {
        for (d = 1; d >= -1; d -= 2) {
          var off = d > 0 ? -0.1 : 0.1;
          var a0 = phase + i * step, a1 = a0 + d * s.phi;
          var p0 = pt(s.rb + off, a0, s.y0), p1 = pt(s.rt + off, a1, s.y0 + s.h);
          for (k = 0; k < SUB; k++) {
            var t0 = k / SUB, t1 = (k + 1) / SUB;
            seg([p0[0] + (p1[0] - p0[0]) * t0, p0[1] + (p1[1] - p0[1]) * t0, p0[2] + (p1[2] - p0[2]) * t0],
                [p0[0] + (p1[0] - p0[0]) * t1, p0[1] + (p1[1] - p0[1]) * t1, p0[2] + (p1[2] - p0[2]) * t1], s.w, d > 0 ? 1 : 2);
          }
        }
      }
      var q0 = pt(s.rb, 0, 0), q1 = pt(s.rt, s.phi, 0);
      for (k = 1; k <= s.rings; k++) {
        var t = k / (s.rings + 1);
        var r = Math.hypot(q0[0] + (q1[0] - q0[0]) * t, q0[2] + (q1[2] - q0[2]) * t);
        ring(s.y0 + s.h * t, r - 0.2, 0.11, 0, s.rb > 8 ? 120 : 60);
      }
      var yt = s.y0 + s.h;
      ring(yt - 0.5, s.rt + 0.2, 0.24, 3, s.rt > 8 ? 120 : 60);
      ring(yt, s.rt + 0.2, 0.28, 3, s.rt > 8 ? 120 : 60);
      phase += s.phi;
    });
    // площадки под вершиной
    [[125, 3.75], [145, 2.5]].forEach(function (d) {
      ring(d[0], d[1] * 0.45, 0.07, 0, 36);
      for (var i = 0; i < 12; i++) seg(pt(d[1] * 0.45, i * 30, d[0]), pt(d[1], i * 30, d[0]), 0.07, 0);
      ring(d[0] + 1.1, d[1] - 0.25, 0.06, 0, 48);
      for (i = 0; i < 24; i++) seg(pt(d[1] - 0.25, i * 15, d[0]), pt(d[1] - 0.25, i * 15, d[0] + 1.1), 0.05, 0);
    });
    // навершие: решётчатая мачта, две траверсы с оттяжками, флагшток до 160 м
    var m = 0.5, yb = 145, ym = 151.5, c = [[m, m], [m, -m], [-m, -m], [-m, m]], yy;
    for (var j = 0; j < 4; j++) {
      var u = c[j], v = c[(j + 1) % 4];
      seg([u[0], yb, u[1]], [u[0] * 0.5, ym, u[1] * 0.5], 0.10, 2);
      for (yy = 0; yy < 4; yy++) {
        var f0 = 1 - 0.5 * yy / 4, f1 = 1 - 0.5 * (yy + 1) / 4, ya = yb + (ym - yb) * yy / 4, yc = yb + (ym - yb) * (yy + 1) / 4;
        seg([u[0] * f0, ya, u[1] * f0], [v[0] * f1, yc, v[1] * f1], 0.06, 2);
        seg([u[0] * f1, yc, u[1] * f1], [v[0] * f1, yc, v[1] * f1], 0.06, 2);
      }
    }
    function traverse(y, half, depth) {
      var nn = Math.round(half * 2), x0, x1, q, PIECES = 8;
      for (q = 0; q < PIECES; q++) seg([-half + 2 * half * q / PIECES, y, 0], [-half + 2 * half * (q + 1) / PIECES, y, 0], 0.11, 2);
      seg([-half + 0.8, y + depth, 0], [0, y + depth, 0], 0.08, 2); seg([0, y + depth, 0], [half - 0.8, y + depth, 0], 0.08, 2);
      seg([-half, y, 0], [-half + 0.8, y + depth, 0], 0.08, 2); seg([half, y, 0], [half - 0.8, y + depth, 0], 0.08, 2);
      for (q = 1; q < nn - 1; q++) {
        x0 = -half + 0.8 + (half * 2 - 1.6) * (q - 1) / (nn - 2); x1 = -half + 0.8 + (half * 2 - 1.6) * q / (nn - 2);
        seg([x0, y + (q % 2 ? depth : 0), 0], [x1, y + (q % 2 ? 0 : depth), 0], 0.05, 2);
      }
      seg([-half, y, 0], [-half / 2, y + 1.6, 0], 0.04, 2); seg([-half / 2, y + 1.6, 0], [0, y + 3.2, 0], 0.04, 2);
      seg([half, y, 0], [half / 2, y + 1.6, 0], 0.04, 2); seg([half / 2, y + 1.6, 0], [0, y + 3.2, 0], 0.04, 2);
    }
    traverse(146.9, 5.2, 0.55);
    traverse(149.6, 3.6, 0.5);
    seg([0, ym, 0], [0, 156, 0], 0.11, 2); seg([0, 156, 0], [0, 160, 0], 0.09, 2);

    var widths = [], n = L.length, style = new Uint8Array(n), styles = [];
    for (var e = 0; e < n; e++) {
      var key = L[e] * 100 + Math.round(S[e * 7 + 6] * 100), idx = widths.indexOf(key);
      if (idx < 0) { idx = widths.length; widths.push(key); styles.push({ layer: L[e], w: S[e * 7 + 6] }); }
      style[e] = idx;
    }
    // стили упорядочены от оси наружу
    var order = styles.map(function (_, i) { return i; }).sort(function (a, b) { return styles[a].layer - styles[b].layer; });
    return { segs: new Float32Array(S), count: n, style: style, styles: styles, order: order };
  }

  var M = null, B = null, NZ = 36, NF = 8, ZMAX = 21;
  function setup() {
    M = build(); B = [];
    for (var i = 0; i < NZ * NF * M.styles.length; i++) B.push([]);
  }

  /* Кадрирование для экрана vw×vh (CSS-пиксели): башня крупно, справа, частично за краем.
     travel 0…1 — ход камеры вдоль оси башни: 0 — у вершины, 1 — у основания.
     travel == null — статичный кадр (нижние секции). */
  var TOP = 165, GROUND = -4;
  function layout(vw, vh, travel) {
    var mobile = vw < 760, R = 19.3, pxm, win, yBottom, lay;
    if (mobile) {
      // телефон: ось башни на правой кромке, видна левая половина
      pxm = vh / 112; win = 112;
      yBottom = travel == null ? GROUND + 2 : (TOP - win) + (GROUND + 2 - (TOP - win)) * travel;
      lay = { pxm: pxm, cx: vw + pxm, camDist: 320, camH: yBottom + win * 0.3, strength: 0.6 };
    } else {
      pxm = Math.min(vh / 52, 0.24 * vw / R); win = vh / pxm;
      yBottom = travel == null ? 6 : (TOP - win) + (GROUND - (TOP - win)) * travel;
      lay = { pxm: pxm, cx: vw - 0.82 * R * pxm, camDist: 170, camH: yBottom + win * 0.25, strength: 1 };
    }
    lay.yBottom = yBottom;
    lay.baseY = vh + yBottom * pxm;   // экранная координата отметки 0 м
    return lay;
  }

  /* draw(ctx, pw, ph, vw, vh, angle, travel): pw×ph — размер холста в пикселях, vw×vh — экран, под который кадрируем. */
  function draw(ctx, pw, ph, vw, vh, angle, travel) {
    if (!M) setup();
    var lay = layout(vw, vh, travel), k = pw / vw;
    var pxm = lay.pxm * k, cx = lay.cx * k, D = lay.camDist, camH = lay.camH;
    var f = pxm * D, hy = lay.baseY * k - pxm * camH;
    var ca = Math.cos(angle), sa = Math.sin(angle);
    var S = M.segs, n = M.count, NS = M.styles.length, i, j;
    var pad = 8 * k;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgb(' + PAPER.join(',') + ')';
    ctx.fillRect(0, 0, pw, ph);
    for (i = 0; i < B.length; i++) B[i].length = 0;

    for (i = 0; i < n; i++) {
      var q = i * 7;
      var x1 = S[q] * ca + S[q + 2] * sa, z1 = -S[q] * sa + S[q + 2] * ca;

<script>
(function () {
  'use strict';
  var screens = [
    { el: document.getElementById('s-wide'), cv: document.getElementById('c-wide'), vw: 1440, vh: 900 },
    { el: document.getElementById('s-phone'), cv: document.getElementById('c-phone'), vw: 390, vh: 844 }
  ];
  screens.forEach(function (s) { s.ctx = s.cv.getContext('2d', { alpha: false }); });
  var still = matchMedia('(prefers-reduced-motion: reduce)');
  var pr = document.getElementById('pr'), deg = document.getElementById('deg'), cam = document.getElementById('cam'), raf = 0, last = -2;

  function progress() {
    if (still.matches) return -1;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    return max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
  }
  function paint() {
    raf = 0;
    var p = progress();
    if (p === last) return;
    last = p;
    var a = p < 0 ? 0 : p, t = p < 0 ? null : p;
    pr.textContent = Math.round(a * 100) + ' %';
    deg.textContent = Math.round(a * 360) + '°';
    cam.textContent = Math.round(ShukhovBg.layout(1440, 900, t).camH) + ' м';
    screens.forEach(function (s) { ShukhovBg.draw(s.ctx, s.cv.width, s.cv.height, s.vw, s.vh, a * Math.PI * 2, t); });
  }
  function kick() { if (!raf) raf = requestAnimationFrame(paint); }
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    screens.forEach(function (s) {
      var r = s.el.getBoundingClientRect();
      s.cv.width = Math.max(2, Math.round(r.width * dpr));
      s.cv.height = Math.max(2, Math.round(r.height * dpr));
    });
    last = -2; kick();
  }
  if (still.matches) document.getElementById('foot').textContent = 'В системе включено уменьшение движения, поэтому башня показана статично, как это будет на сайте.';
  document.getElementById('ghost-toggle').addEventListener('change', function () { document.getElementById('stick').classList.toggle('show-ghost', this.checked); });
  window.addEventListener('scroll', kick, { passive: true });
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(screens[0].el);
  resize();
